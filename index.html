<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2D 무기 투척 배틀 아레나</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    body {
      background: #0f172a;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* 1. 계정 등록 창 */
    #registerOverlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: flex; justify-content: center; align-items: center; z-index: 100;
    }
    .modal-card {
      background: #1e293b; padding: 32px; border-radius: 16px; width: 340px;
      border: 2px solid #38bdf8; text-align: center;
    }
    .modal-card input {
      width: 100%; padding: 12px; margin: 16px 0; border-radius: 8px;
      border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px;
    }

    /* 2. 메인 로비 / 상점 */
    #lobbyScreen {
      position: fixed; inset: 0; background: #0b1120;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 50; padding: 20px; overflow-y: auto;
    }
    .lobby-header { text-align: center; margin-bottom: 16px; }
    .gold-box { font-size: 24px; color: #facc15; font-weight: bold; margin-top: 4px; }
    .shop-container {
      display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 600px;
    }
    .shop-card {
      background: #1e293b; border: 2px solid #334155; border-radius: 12px;
      padding: 10px; width: 110px; text-align: center; cursor: pointer;
      transition: all 0.2s;
    }
    .shop-card:hover { transform: translateY(-3px); border-color: #38bdf8; }
    .shop-card.selected { border-color: #4ade80; background: #064e3b; }
    .btn {
      padding: 12px 24px; font-size: 18px; font-weight: bold; border-radius: 8px;
      border: none; cursor: pointer; transition: 0.2s;
    }
    .btn-green { background: #22c55e; color: white; }
    .btn-blue { background: #0284c7; color: white; }

    /* 3. 인게임 캔버스 및 HUD */
    #gameScreen { display: none; width: 100vw; height: 100vh; position: relative; }
    canvas { display: block; width: 100%; height: 100%; background: #111827; }
    #hud {
      position: absolute; top: 12px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center; pointer-events: none;
    }
    #hud * { pointer-events: auto; }
    .top-btn {
      background: #dc2626; color: white; border: none; padding: 6px 12px;
      border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px;
    }
    .fs-btn { background: #475569; margin-right: 6px; }
    #weaponNotice {
      position: absolute; top: 48px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 20px; font-size: 12px;
      pointer-events: none;
    }

    /* 4. 모바일 터치 전용 컨트롤러 */
    #mobileControls {
      display: none; position: absolute; inset: 0; pointer-events: none;
    }
    /* 가상 조이스틱 */
    #joystickZone {
      position: absolute; bottom: 30px; left: 24px; width: 120px; height: 120px;
      background: rgba(255, 255, 255, 0.12); border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%; pointer-events: auto; touch-action: none;
    }
    #joystickKnob {
      position: absolute; top: 50%; left: 50%; width: 44px; height: 44px;
      background: rgba(56, 189, 248, 0.75); border-radius: 50%;
      transform: translate(-50%, -50%); pointer-events: none;
    }
    /* 투척 버튼 */
    #throwBtn {
      position: absolute; bottom: 36px; right: 28px; width: 80px; height: 80px;
      background: rgba(239, 68, 68, 0.8); border: 3px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%; display: flex; justify-content: center; align-items: center;
      font-weight: bold; font-size: 17px; pointer-events: auto; touch-action: none;
    }
    #throwBtn:active {
      background: rgba(220, 38, 38, 1); transform: scale(0.92);
    }
  </style>
</head>
<body>

  <!-- 계정 생성 창 -->
  <div id="registerOverlay" style="display: none;">
    <div class="modal-card">
      <h2>전사 등록</h2>
      <p style="color:#94a3b8; font-size:13px; margin-top:4px;">닉네임과 재화는 자동 저장됩니다.</p>
      <input type="text" id="regNameInput" placeholder="닉네임 입력 (2~8자)" maxlength="8">
      <button class="btn btn-blue" style="width:100%;" onclick="registerAccount()">등록 완료</button>
    </div>
  </div>

  <!-- 메인 로비 & 상점 -->
  <div id="lobbyScreen">
    <div class="lobby-header">
      <h1 style="color:#38bdf8;">⚔️ WEAPON THROW .IO</h1>
      <p id="greetingUser" style="margin-top:4px; font-size:15px;">환영합니다!</p>
      <div class="gold-box">🪙 <span id="lobbyGold">0</span> G</div>
    </div>

    <h3 style="margin-bottom:8px; font-size:14px;">출격 무기 선택</h3>
    <div class="shop-container" id="weaponShopList"></div>

    <div style="margin-top: 16px;">
      <button class="btn btn-green" onclick="enterGame()">전장 난입하기 (BATTLE)</button>
    </div>
  </div>

  <!-- 게임 화면 -->
  <div id="gameScreen">
    <div id="hud">
      <div style="font-weight:bold; font-size:14px;">
        HP: <span id="hpDisplay" style="color:#4ade80;">100</span> | K: <span id="killDisplay">0</span>
      </div>
      <div>
        <button class="top-btn fs-btn" onclick="toggleFullScreen()">⛶ 전체화면</button>
        <button class="top-btn" onclick="leaveToLobby()">로비 (나가기)</button>
      </div>
    </div>
    <div id="weaponNotice">무기: <span id="equippedBadge" style="color:#facc15;">도끼</span></div>
    <canvas id="gameCanvas"></canvas>

    <!-- 모바일 가상 패드 -->
    <div id="mobileControls">
      <div id="joystickZone">
        <div id="joystickKnob"></div>
      </div>
      <div id="throwBtn">투척!</div>
    </div>
  </div>

  <script>
    const MAP_SIZE = 2400;
    const WEAPON_CONFIG = {
      axe: { speed: 13, damage: 45, maxDist: 480, size: 16, cooldown: 650, color: '#f87171' },
      dagger: { speed: 21, damage: 20, maxDist: 600, size: 9, cooldown: 220, color: '#38bdf8' },
      spear: { speed: 25, damage: 55, maxDist: 850, size: 14, cooldown: 850, color: '#fbbf24' },
      boomerang: { speed: 15, damage: 32, maxDist: 400, size: 13, cooldown: 500, color: '#a78bfa' },
      bomb: { speed: 11, damage: 60, maxDist: 380, size: 18, cooldown: 1100, color: '#f97316' }
    };

    const WEAPONS = [
      { id: 'axe', name: '전투 도끼', price: 0, desc: '묵직한 한방' },
      { id: 'dagger', name: '암살 단검', price: 150, desc: '초고속 연사' },
      { id: 'spear', name: '관통 투창', price: 300, desc: '장거리 저격' },
      { id: 'boomerang', name: '부메랑', price: 450, desc: '되돌아오는 관통' },
      { id: 'bomb', name: '폭탄 화염병', price: 600, desc: '강력한 범위 폭발' }
    ];

    let userAccount = JSON.parse(localStorage.getItem('weaponGameUser')) || null;

    function initAccount() {
      if (!userAccount) {
        document.getElementById('registerOverlay').style.display = 'flex';
      } else {
        document.getElementById('registerOverlay').style.display = 'none';
        renderLobby();
      }
    }

    function registerAccount() {
      const name = document.getElementById('regNameInput').value.trim();
      if (name.length < 2) return alert('닉네임을 2글자 이상 입력하세요.');
      userAccount = {
        name: name,
        gold: 100,
        equippedWeapon: 'axe',
        unlockedWeapons: ['axe']
      };
      saveAccount();
      initAccount();
    }

    function saveAccount() {
      localStorage.setItem('weaponGameUser', JSON.stringify(userAccount));
    }
